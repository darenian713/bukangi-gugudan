<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1E88E5">
  <title>부캉이의 부산 여행 – 구구단</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <button type="button" id="soundBtn" class="sound-btn" aria-label="소리 설정">🎵</button>
  <div class="sound-toast" id="soundToast" aria-live="polite"></div>

  <!-- 1. 시작 화면 -->
  <section id="screen-start" class="screen active" aria-label="시작 화면">
    <div class="full-bg" id="startBg"></div>
    <div class="start-card">
      <p class="school-mark" data-school></p>
      <h1 class="title"><span class="title-sub">구구단</span><span data-title></span></h1>
      <div class="hero-char" data-char></div>
      <label class="name-label" for="playerName">이름을 적어주세요.</label>
      <input id="playerName" type="text" maxlength="14" placeholder="예: 홍길동" autocomplete="off" enterkeyhint="go">
      <button type="button" class="btn primary big" id="btnStart">혼자 하기 ▶</button>
      <a class="btn big battle-link" href="battle/" aria-label="실시간 대결: 교실 TV와 태블릿으로 친구들과 함께">👥 실시간 대결</a>
      <details class="howto">
        <summary>어떻게 하나요?</summary>
        <p>구구단 답을 키패드로 누르고 <b>확인</b>! 정답을 모으면 부캉이가 부산 명소 5곳을 지나 바다로 돌아가요. 시간 안에 최대한 멀리 가 보세요.</p>
      </details>
    </div>
  </section>

  <!-- 2. 단계 선택 -->
  <section id="screen-level" class="screen" aria-label="단계 선택">
    <div class="level-head">
      <button type="button" class="btn small" id="btnLevelBack" aria-label="처음 화면으로">← 처음으로</button>
      <h2>나의 단계를 골라요</h2>
      <p class="hello" id="helloText"></p>
    </div>
    <div class="level-grid" id="levelGrid"></div>
  </section>

  <!-- 3. 게임 화면 -->
  <section id="screen-game" class="screen" aria-label="문제 풀이">
    <header class="game-top">
      <button type="button" class="pause-btn" id="btnPause" aria-label="멈춤 (처음으로 가기)">⏸<span>멈춤</span></button>
      <span class="school-mark mini" data-school></span>
      <div class="timer" id="timer" role="timer" aria-label="남은 시간">
        <div class="timer-bar" id="timerBar"></div>
        <span class="timer-text" id="timerText">60초</span>
      </div>
      <div class="score-box" aria-label="점수">점수 <b id="scoreText">0</b></div>
    </header>
    <div class="map-bar" id="mapBar" aria-label="여행 지도"></div>
    <div class="game-body">
      <div class="play-area">
        <div class="scene" id="scene">
          <div class="scene-bg" id="sceneBg"></div>
          <div class="char-wrap" id="charWrap"><div class="char" id="gameChar" data-char></div></div>
          <div class="pill place-label" id="placeLabel"></div>
          <div class="pill place-progress" id="placeProgress"></div>
          <div class="combo" id="comboText" aria-live="polite"></div>
          <div class="arrive" id="arriveText"></div>
          <div class="feedback" id="feedback" aria-live="assertive"></div>
        </div>
        <div class="question" id="questionBox">
          <span id="qA">?</span><span class="op">×</span><span id="qB">?</span><span class="op">=</span><span class="answer empty" id="answerBox" aria-label="입력한 답"></span>
        </div>
      </div>
      <div class="keypad" id="keypad" aria-label="숫자 키패드"></div>
    </div>
    <div class="countdown" id="countdown" hidden><span id="countdownNum">3</span></div>
    <div class="pause-menu" id="pauseMenu" hidden role="dialog" aria-modal="true" aria-labelledby="pauseTitle">
      <div class="pause-card">
        <h2 id="pauseTitle">⏸ 잠깐 멈췄어요</h2>
        <p>시간도 같이 멈춰 있어요.</p>
        <button type="button" class="btn primary big" id="btnResume">▶ 계속하기</button>
        <div class="pause-row">
          <button type="button" class="btn" id="btnPauseLevel">🎚️ 단계 바꾸기</button>
          <button type="button" class="btn" id="btnPauseHome">🏠 처음으로</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 4. 엔딩 -->
  <section id="screen-ending" class="screen" aria-label="엔딩">
    <div class="full-bg" id="endingBg"></div>
    <div class="sky-icons" id="skyIcons"></div>
    <div class="ending-char-move" id="endingCharMove"></div>
    <div class="ending-msg" id="endingMsg"></div>
    <p class="skip-hint">화면을 누르면 건너뛰어요 ▶▶</p>
  </section>

  <!-- 5. 결과 화면 -->
  <section id="screen-result" class="screen" aria-label="결과">
    <div class="result-wrap">
      <div class="result-head">
        <h2 id="resultTitle"></h2>
        <p id="resultMsg"></p>
      </div>
      <div class="card">
        <p class="reach-text" id="reachText"></p>
        <div class="map-bar result-map" id="resultMap"></div>
        <div class="stars" id="resultStars"></div>
      </div>
      <div class="card stat-grid">
        <div class="stat main"><span class="num" id="statScore">0</span><span class="label">총점</span><span class="badge" id="newRecord" hidden>신기록!</span></div>
        <div class="stat"><span class="num" id="statCorrect">0</span><span class="label">정답 수</span></div>
        <div class="stat"><span class="num" id="statAcc">0%</span><span class="label">정답률</span></div>
        <div class="stat"><span class="num" id="statPassed">0/5</span><span class="label">통과한 명소</span></div>
        <p class="score-detail" id="scoreDetail"></p>
        <p class="best-text" id="bestText"></p>
      </div>
      <div class="card">
        <h3>📝 다시 볼 문제</h3>
        <ul class="review-list" id="reviewList"></ul>
      </div>
      <div class="result-btns">
        <button type="button" class="btn primary" id="btnRetry">🔁 다시 도전</button>
        <button type="button" class="btn" id="btnChangeLevel">🎚️ 단계 바꾸기</button>
        <button type="button" class="btn" id="btnHome">🏠 처음으로</button>
      </div>
      <div class="card grip-card">
        <h3>GRIP 기록용 요약</h3>
        <p class="grip-line" id="gripLine"></p>
        <button type="button" class="btn small" id="btnCopy">📋 복사하기</button>
      </div>
      <p class="school-mark foot" data-school></p>
    </div>
  </section>
</div>

<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/sound.js"></script>
<script src="js/questions.js"></script>
<script src="js/keypad.js"></script>
<script src="js/timer.js"></script>
<script src="js/scenes.js"></script>
<script src="js/main.js"></script>
</body>
</html>
